<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Swap</title>
<style>
:root{--bg:#fafafa;--fg:#111;--muted:#777;--line:#ddd;--accent:#111;--card:#fff}
body{margin:0;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px}h2{font-size:15px;margin:24px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.grid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:3px solid transparent;cursor:pointer}
.grid img.sel{border-color:var(--accent)}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;flex:1;min-width:260px}
.box img,.box video{width:100%;border-radius:8px}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer}
button:disabled{opacity:.4}
input[type=text],select{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--line);border-radius:8px;margin:6px 0}
.muted{color:var(--muted);font-size:13px}
</style></head><body><main>
<h1>제품 교체 합성 → 숏폼 영상</h1>
<h2>1. 레퍼런스 선택 <label class="muted" style="cursor:pointer">(+ 레퍼런스 추가 <input id="addRef" type="file" accept="image/*" multiple hidden>)</label></h2>
<div id="refs" class="grid"></div>
<div class="row">
  <div class="box"><h2>2. 제품 사진 (모델컷)</h2><input id="product" type="file" accept="image/*"><img id="productPrev">
    <input id="extra" type="text" placeholder="추가 지시 (선택) 예: 지퍼는 끝까지 올린 상태">
    <button id="compose" disabled>합성하기</button> <span id="cStatus" class="muted"></span></div>
  <div class="box"><h2>3. 합성 결과</h2><img id="composite">
    <select id="provider"><option value="fal">fal.ai (Kling)</option><option value="higgsfield">Higgsfield</option><option value="sora">OpenAI Sora</option></select>
    <select id="seconds"><option selected>5</option><option>10</option></select>
    <button id="video" disabled>포즈 영상 만들기</button> <span id="vStatus" class="muted"></span>
    <video id="out" controls loop playsinline></video></div>
</div>
</main><script>
const $=id=>document.getElementById(id);let ref=null,productUrl=null,composite=null;
const dataUrl=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
const api=async(p,b)=>{const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw new Error(j.error);return j};
async function loadRefs(){const list=await (await fetch('/api/references')).json();$('refs').innerHTML='';
  if(!list.length)$('refs').innerHTML='<p class="muted">references/ 폴더에 레퍼런스 이미지를 넣거나 위에서 추가하세요.</p>';
  for(const f of list){const i=new Image();i.src='/references/'+encodeURIComponent(f);i.onclick=()=>{ref=f;document.querySelectorAll('.grid img').forEach(x=>x.classList.toggle('sel',x===i));upd()};$('refs').append(i)}}
const upd=()=>{$('compose').disabled=!(ref&&productUrl);$('video').disabled=!composite};
$('addRef').onchange=async e=>{for(const f of e.target.files)await api('/api/references',{name:f.name,dataUrl:await dataUrl(f)});loadRefs()};
$('product').onchange=async e=>{productUrl=await dataUrl(e.target.files[0]);$('productPrev').src=productUrl;upd()};
$('compose').onclick=async()=>{$('compose').disabled=true;$('cStatus').textContent='합성 중… (30초~1분)';
  try{const {file}=await api('/api/compose',{reference:ref,productDataUrl:productUrl,extraPrompt:$('extra').value});composite=file;$('composite').src='/output/'+file;$('cStatus').textContent='완료'}
  catch(e){$('cStatus').textContent='오류: '+e.message}upd()};
$('video').onclick=async()=>{$('video').disabled=true;$('vStatus').textContent='영상 생성 중… (수 분)';
  try{const {file}=await api('/api/video',{image:composite,provider:$('provider').value,seconds:$('seconds').value});$('out').src='/output/'+file;$('vStatus').textContent='완료'}
  catch(e){$('vStatus').textContent='오류: '+e.message}upd()};
loadRefs();
</script></body></html>
