[project]
name = "seo-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29", "alembic>=1.13", "pydantic>=2.7", "pydantic-settings>=2.3",
  "celery[redis]>=5.4", "redis>=5.0", "httpx>=0.27", "tenacity>=8.3",
  "structlog>=24.1", "prometheus-client>=0.20", "jinja2>=3.1",
  "playwright>=1.45", "pgvector>=0.2.5", "pyyaml>=6.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
[tool.ruff]
line-length = 100
[tool.mypy]
strict = true
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
