services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: seo, POSTGRES_PASSWORD: seo, POSTGRES_DB: seo }
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
  api:
    build: .
    env_file: .env
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    ports: ["8000:8000"]
    volumes: ["./:/app"]
  worker:
    build: .
    env_file: .env
    depends_on: [api, redis, db]
    command: ["celery","-A","apps.worker.celery_app","worker","-Q","q_serp,q_content,q_publish,q_index,q_link,q_ctr,q_report,q_gbp","-c","4"]
    volumes: ["./:/app"]
  beat:
    build: .
    env_file: .env
    depends_on: [redis, db]
    command: ["celery","-A","apps.worker.celery_app","beat"]
    volumes: ["./:/app"]
volumes:
  pgdata:
