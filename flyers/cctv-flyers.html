<title>경기정보통신 CCTV 전단 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"Dohyeon";src:url(fonts/BMDOHYEON.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Hanna";src:url(fonts/BMHANNAPro.woff2) format("woff2");font-display:swap}

/* 레이아웃: 레퍼런스 10가지 포스터 문법 x 3시안 = 30장, A4 카드 그리드 */
:root{--bg:#e9eaec;--fg:#16191e;--muted:#5d6470;--chip:#fff;--sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--fg:#e9ecef;--muted:#9aa3ae;--chip:#22262c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171b;--fg:#e9ecef;--muted:#9aa3ae;--chip:#22262c;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans)}
.wrap{max-width:1400px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:2rem;font-weight:900;letter-spacing:-.03em;margin:0 0 8px}
.lead{color:var(--muted);line-height:1.65;max-width:72ch;margin:0 0 20px}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:0 0 32px;padding:0;list-style:none}
.refs li{background:var(--chip);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.5;color:var(--muted)}
.refs b{display:block;color:var(--fg);font-size:14px;margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px}
.item{display:flex;flex-direction:column;gap:8px;min-width:0}
.meta{font-size:13px;color:var(--muted)}.meta b{color:var(--fg)}

/* ---- 포스터 공통 (인쇄물: 고정색) ---- */
.f{aspect-ratio:210/297;max-width:100%;container-type:inline-size;position:relative;overflow:hidden;border-radius:3px;box-shadow:0 3px 14px rgba(0,0,0,.18);font-family:var(--sans);color:var(--ink);background:var(--paper);word-break:keep-all;line-height:1.2}
.f *{box-sizing:border-box}
.f .abs{position:absolute}
.f .brand,.f .tel{width:fit-content}
.L10 .seal{position:absolute;right:4cqi;bottom:30cqi}
.L7 .bot{align-items:flex-start!important}
.L7 .band{bottom:31cqi!important}
.f .qr{position:absolute;right:5cqi;bottom:5cqi;z-index:6;width:19cqi;background:#fff;padding:1.2cqi;border-radius:1.6cqi;box-shadow:0 .6cqi 2cqi rgba(0,0,0,.25);text-align:center;color:#111}
.f .qr img{width:100%;height:auto;object-fit:contain}
.f .qr b{display:block;font-size:2.2cqi;font-weight:900;letter-spacing:-.03em;margin-top:.6cqi;line-height:1.2;font-size:2.6cqi!important}
.f .cam{position:absolute;z-index:4;filter:drop-shadow(0 1.6cqi 1.8cqi rgba(0,0,0,.35));pointer-events:none}
.f .cam img{width:100%;height:auto;object-fit:contain}
.f img{display:block;width:100%;height:100%;object-fit:cover;max-width:none}
.f .brand{font-weight:900;font-size:3.4cqi;letter-spacing:-.02em}
.f .brand small{font-weight:600;opacity:.7;margin-left:1.2cqi;font-size:2.8cqi}
.f .tel{font-family:"Dohyeon",var(--sans);font-size:9cqi;line-height:1;white-space:nowrap}
.f .tel s{text-decoration:none;font-family:var(--sans);font-weight:900;font-size:2.7cqi;vertical-align:.9em;margin-right:1.5cqi;padding:.8cqi 1.6cqi;border-radius:5cqi;background:var(--acc);color:var(--accInk)}
.f .fine{font-size:2.6cqi;font-weight:600;opacity:.75;line-height:1.4}
.f .pts{display:flex;flex-wrap:wrap;gap:1.4cqi}
.f .pts span{font-weight:800;font-size:3.3cqi;padding:1.2cqi 2.4cqi;border:.45cqi solid currentColor;border-radius:5cqi}
.f em{font-style:normal}

/* 1 ECON: 단색 + 거대 타이포 (The Economist 레드 포스터) */
.L1 .wrapper{position:absolute;inset:0;padding:7cqi;display:flex;flex-direction:column}
.L1 .k{font-weight:800;font-size:4cqi;letter-spacing:-.02em;opacity:.85}
.L1 .h{font-weight:900;font-size:var(--hs,19cqi);letter-spacing:-.07em;line-height:.98;margin-top:4cqi}
.L1 .h em{color:var(--acc2)}
.L1 .bot{margin-top:auto;border-top:.6cqi solid currentColor;padding-top:3.5cqi;display:flex;flex-direction:column;gap:1.5cqi}

/* 2 SMALL: 여백 + 작은 사진 (VW Think Small) */
.L2 .ph{position:absolute;left:50%;top:13cqi;width:var(--pw,46cqi);aspect-ratio:3/4;transform:translateX(-50%)}
.L2 .txt{position:absolute;left:8cqi;right:8cqi;bottom:31cqi}
.L2 .h{font-weight:900;font-size:7.6cqi;letter-spacing:-.05em;line-height:1.12}
.L2 .h em{color:var(--acc2)}
.L2 .s{font-size:3.3cqi;font-weight:600;line-height:1.6;margin-top:3cqi;opacity:.85}
.L2 .bot{position:absolute;left:8cqi;right:8cqi;bottom:6cqi;display:flex;flex-direction:column;gap:1cqi;border-top:.3cqi solid currentColor;padding-top:3cqi}
.L2 .tel{font-size:7.2cqi}

/* 3 SHOT: 풀블리드 사진 + 하단 미니멀 카피 (Shot on iPhone) */
.L3 .ph{position:absolute;inset:0}

.L3 .k{font-weight:800;font-size:3.4cqi;color:#ffd400}
.L3 .h{font-weight:900;font-size:10cqi;letter-spacing:-.055em;line-height:1.08}

.L3 .row{display:flex;flex-direction:column;gap:1cqi;border-top:.3cqi solid rgba(255,255,255,.5);padding-top:2.6cqi;margin-top:1.5cqi}

.L3 .corner{position:absolute;top:6cqi;left:7cqi;color:#fff;font-weight:900;font-size:3.2cqi;letter-spacing:.02em;text-shadow:0 1px 6px rgba(0,0,0,.5)}

/* 4 SWISS: 거대 숫자 블리드 + 그리드 (스위스 스타일) */
.L4 .num{position:absolute;right:-6cqi;top:-14cqi;font-weight:900;font-size:var(--ns,88cqi);letter-spacing:-.08em;line-height:1;color:var(--acc)}
.L4 .vert{position:absolute;left:5cqi;bottom:30cqi;writing-mode:vertical-rl;font-weight:800;font-size:3cqi;letter-spacing:.3em}
.L4 .ph{position:absolute;left:12cqi;top:70cqi;width:36cqi;height:36cqi}
.L4 .txt{position:absolute;left:12cqi;right:5cqi;top:70cqi;z-index:2}
.L4 .num{z-index:0}
.L4 .h{font-weight:900;font-size:7.4cqi;letter-spacing:-.055em;line-height:1.1;margin-left:40cqi;margin-top:3cqi}
.L4 .k{font-weight:800;font-size:3.2cqi;margin-left:40cqi;line-height:1.35}
.L4 .rule{position:absolute;left:12cqi;right:0;height:.35cqi;background:currentColor}
.L4 .bot{position:absolute;left:12cqi;right:6cqi;bottom:6cqi;display:flex;flex-direction:column;gap:1cqi}

/* 5 BAEMIN: 문장 자체가 그림 - 줄마다 크기를 달리한 꽉 찬 타이포 */
.L5 .wrapper{position:absolute;inset:0;padding:7cqi 6cqi;display:flex;flex-direction:column}
.L5 .h{font-family:"Dohyeon",var(--sans);line-height:1.02;letter-spacing:-.02em}
.L5 .h span{display:block;white-space:nowrap}
.L5 .h em{color:var(--acc2)}
.L5 .ph{display:none;width:30cqi;height:30cqi;border-radius:50%;overflow:hidden;position:absolute;right:6cqi;bottom:30cqi;border:1.2cqi solid var(--paper);box-shadow:0 0 0 .5cqi var(--ink)}
.L5 .bot{margin-top:auto;display:flex;flex-direction:column;gap:1.4cqi}

/* 6 TOSS: 숫자 하나로 말하기 */
.L6 .wrapper{position:absolute;inset:0;padding:9cqi 8cqi 7cqi;display:flex;flex-direction:column}
.L6 .k{font-weight:800;font-size:4.2cqi;opacity:.6}
.L6 .num{font-weight:900;font-size:var(--ns,46cqi);letter-spacing:-.075em;line-height:.9;color:var(--acc);margin:4cqi 0 3cqi -1.5cqi}
.L6 .num small{font-size:.32em;letter-spacing:-.04em;margin-left:1cqi}
.L6 .h{font-weight:900;font-size:7.4cqi;letter-spacing:-.05em;line-height:1.15}
.L6 .s{font-size:3.2cqi;font-weight:600;opacity:.6;margin-top:2.6cqi;line-height:1.55}
.L6 .ph{position:absolute;right:0;bottom:30cqi;width:34cqi;height:26cqi}
.L6 .s{max-width:56%}
.L6 .bot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:2cqi}
.L6 .tel{font-size:7.6cqi}

/* 7 MART: 국내 마트 전단 문법 - 버스트, 사선 띠, 기울인 사진 */
.L7 .burst{position:absolute;right:3cqi;top:4cqi;width:40cqi;height:40cqi;display:grid;place-items:center;z-index:3;transform:rotate(10deg)}
.L7 .burst svg{position:absolute;inset:0;width:100%;height:100%}
.L7 .burst b{position:relative;font-family:"Dohyeon",var(--sans);font-weight:400;color:#fff;font-size:10cqi;line-height:.95;text-align:center}
.L7 .burst b small{display:block;font-family:var(--sans);font-weight:900;font-size:3.4cqi}
.L7 .k{position:absolute;left:6cqi;top:8cqi;background:#111;color:#fff;z-index:2;font-weight:900;font-size:4cqi;padding:1.4cqi 3cqi;transform:rotate(-3deg)}
.L7 .h{position:absolute;left:6cqi;right:6cqi;top:18cqi;font-family:"Dohyeon",var(--sans);font-size:15cqi;line-height:1;letter-spacing:-.02em;color:#d0021b;-webkit-text-stroke:.9cqi #fff;paint-order:stroke fill;text-shadow:1.2cqi 1.2cqi 0 #111}
.L7 .ph{position:absolute;left:9cqi;top:60cqi;width:52cqi;height:44cqi;border:2cqi solid #fff;box-shadow:1.4cqi 1.4cqi 0 rgba(0,0,0,.25);transform:rotate(-4deg)}
.L7 .list{position:absolute;right:5cqi;top:66cqi;width:32cqi;display:flex;flex-direction:column;gap:1.6cqi}
.L7 .list span{background:#fff;color:#111;font-weight:900;font-size:3.4cqi;padding:1.6cqi 2cqi;border-left:1.4cqi solid var(--acc2);line-height:1.25}
.L7 .band{position:absolute;left:-5cqi;right:-5cqi;bottom:21cqi;background:#111;color:#fff;transform:rotate(-3deg);padding:2.4cqi 10cqi;font-weight:900;font-size:4.2cqi;text-align:center;letter-spacing:-.02em}
.L7 .bot{position:absolute;left:6cqi;right:6cqi;bottom:4cqi;display:flex;flex-direction:column;align-items:center;gap:.6cqi}
.L7 .tel{font-size:10cqi}

/* 8 OVERLAP: 사진과 겹치는 아웃라인 대형 타이포 */
.L8 .ph{position:absolute;left:0;right:0;top:0;height:86cqi}
.L8 .txt{position:absolute;left:5cqi;right:5cqi;top:60cqi;display:flex;flex-direction:column;gap:3cqi}
.L8 .h{font-weight:900;font-size:var(--hs,17cqi);letter-spacing:-.07em;line-height:.95}
.L8 .h span{display:block}
.L8 .h .o{color:transparent;-webkit-text-stroke:.55cqi #fff}
.L8 .h .f2{color:var(--acc)}
.L8 .s{padding-left:1cqi;max-width:72%;font-weight:800;font-size:3.8cqi;line-height:1.5}
.L8 .bot{position:absolute;left:6cqi;right:6cqi;bottom:6cqi;display:flex;flex-direction:column;gap:1cqi;border-top:.35cqi solid currentColor;padding-top:2.6cqi}
.L8 .tel{font-size:9cqi}

/* 9 SPLIT: 사선 분할 비교 */
.L9 .left,.L9 .right{position:absolute;inset:0}
.L9 .left{background:#d9dade;clip-path:polygon(0 0,62% 0,38% 100%,0 100%)}
.L9 .right{background:var(--acc);clip-path:polygon(62% 0,100% 0,100% 100%,38% 100%)}
.L9 .ph{position:absolute;left:0;right:0;top:0;height:40cqi;z-index:1}
.L9 .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.55))}
.L9 .ttl{position:absolute;left:6cqi;right:6cqi;top:28cqi;z-index:2;color:#fff;font-weight:900;font-size:7.4cqi;letter-spacing:-.05em;line-height:1.1}
.L9 .col{position:absolute;top:50cqi;width:40cqi;display:flex;flex-direction:column;gap:2.2cqi}
.L9 .col.a{left:6cqi;color:#555b66}.L9 .col.b{right:6cqi;color:var(--accInk);text-align:right;align-items:flex-end}
.L9 .col b{font-weight:900;font-size:4.6cqi;letter-spacing:-.03em}
.L9 .col span{font-weight:800;font-size:3.6cqi;line-height:1.3}
.L9 .col.a span{text-decoration:line-through;text-decoration-thickness:.5cqi;text-decoration-color:#d0021b}
.L9 .vs{top:62cqi!important;color:#fff!important;background:#111!important;position:absolute;left:50%;top:76cqi;transform:translate(-50%,-50%);width:16cqi;height:16cqi;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:"Dohyeon";font-size:6cqi;z-index:2}
.L9 .bot{position:absolute;left:0;right:0;bottom:0;background:#111;color:#fff;padding:4cqi 6cqi;display:flex;flex-direction:column;gap:1cqi}

/* 10 LETTER: 손편지 + 폴라로이드 */
.L10{background:var(--paper) repeating-linear-gradient(0deg,transparent 0 6.2cqi,rgba(90,60,30,.12) 6.2cqi 6.4cqi)}
.L10 .pol{position:absolute;right:7cqi;top:8cqi;width:44cqi;background:#fff;padding:2.2cqi 2.2cqi 8cqi;box-shadow:0 1.5cqi 3cqi rgba(0,0,0,.22);transform:rotate(5deg)}
.L10 .pol div{aspect-ratio:1}
.L10 .pol i{position:absolute;bottom:2.2cqi;left:0;right:0;text-align:center;font-family:"Hanna";font-style:normal;font-size:3.6cqi;color:#555}
.L10 .tape{position:absolute;right:20cqi;top:5cqi;width:18cqi;height:5cqi;background:rgba(255,236,170,.85);transform:rotate(-8deg);z-index:2}
.L10 .k{position:absolute;left:7cqi;top:12cqi;width:40cqi;font-family:"Hanna";font-size:4.4cqi;line-height:1.5;color:var(--acc2)}
.L10 .h{position:absolute;left:7cqi;right:7cqi;top:64cqi;font-family:"Hanna";font-size:var(--hs,10.5cqi);line-height:1.18;letter-spacing:-.02em}
.L10 .h em{background:linear-gradient(transparent 60%,var(--mk) 60%)}
.L10 .s{position:absolute;left:7cqi;right:33cqi;top:96cqi;font-family:"Hanna";font-size:4.2cqi;line-height:1.55;opacity:.85}
.L10 .bot{position:absolute;left:7cqi;right:7cqi;bottom:6cqi;display:flex;justify-content:space-between;align-items:flex-end}
.L10 .seal{width:22cqi;height:22cqi;border-radius:50%;border:.8cqi solid var(--acc2);color:var(--acc2);display:grid;place-items:center;text-align:center;font-weight:900;font-size:3.2cqi;transform:rotate(-12deg);line-height:1.2}
.L10 .tel{font-size:8cqi}
</style>
<div class="wrap">
<h1>경기정보통신 CCTV 전단 시안 30종</h1>
<p class="lead">국내외 광고 레퍼런스 10가지의 포스터 문법을 가져와 각각 3장씩 변주했습니다. 시니어 대상이라 어떤 구성에서도 핵심 문장과 전화번호는 크게 남겼습니다. QR을 휴대폰 카메라로 찍으면 1522-1201로 바로 전화가 걸립니다. 수치 표현은 근거 확인이 필요합니다.</p>
<ul class="refs" id="refs"></ul>
<div class="grid" id="g"></div></div>
<script>
const TEL="1522-1201",BR=`경기정보통신 CCTV<small>자세 프랜드</small>`;
const CAMPOS={1:"right:-4cqi;top:60cqi;width:44cqi",2:"left:56cqi;top:36cqi;width:36cqi",3:"right:4cqi;top:5cqi;width:30cqi",4:"right:3cqi;top:24cqi;width:40cqi",5:"right:3cqi;bottom:34cqi;width:36cqi",6:"right:-3cqi;top:12cqi;width:52cqi",7:"left:39cqi;top:44cqi;width:28cqi",8:"right:3cqi;top:5cqi;width:32cqi",9:"left:28cqi;top:84cqi;width:44cqi",10:"left:6cqi;top:36cqi;width:34cqi"};
const CAMS=["c_dome","c_bullet_w","c_ptz","c_bullet_b","c_set"];
const P={ // paper ink acc accInk acc2 mk
 red:["#e3120b","#fff","#fff","#e3120b","#ffd84d","#ffd84d"],
 navy:["#0f1e3c","#fff","#ffd400","#0f1e3c","#ffd400","#ffd400"],
 white:["#ffffff","#121417","#d0021b","#fff","#d0021b","#ffe14d"],
 ivory:["#f6f2ea","#16181c","#16181c","#f6f2ea","#c8102e","#ffd84d"],
 yellow:["#ffd400","#111","#111","#ffd400","#d0021b","#fff"],
 green:["#0e5b3a","#fff","#c8f26b","#0e5b3a","#c8f26b","#c8f26b"],
 sky:["#eaf3ff","#0b2447","#1764d6","#fff","#1764d6","#ffe066"],
 kraft:["#efe3cc","#3a2a17","#3a2a17","#efe3cc","#b8461b","#ffd27a"],
 orange:["#ff6a13","#111","#111","#ff6a13","#fff","#fff"],
 black:["#101215","#fff","#ffd400","#101215","#ffd400","#ffd400"],
 mint:["#dff5ee","#0b3b30","#0f8a6a","#fff","#0f8a6a","#ffe066"]};
const img=n=>`<img src="img/p${String(n).padStart(2,"0")}.jpg" alt="">`;
const tel=t=>`<div class="tel"><s>무료상담</s>${TEL}</div>`;
const L={
1:d=>`<div class="wrapper"><div class="k">${d.k}</div><div class="h" style="--hs:${d.hs||19}cqi">${d.h}</div><div class="bot"><div class="brand">${BR}</div>${tel()}<div class="pts">${d.p.map(x=>`<span>${x}</span>`).join("")}</div></div></div>`,
2:d=>`<div class="ph abs">${img(d.i)}</div><div class="txt"><div class="h">${d.h}</div><div class="s">${d.s}</div></div><div class="bot"><div class="brand">${BR}</div>${tel()}</div>`,
3:d=>`<div class="ph">${img(d.i)}</div><div class="shade"></div><div class="corner">경기정보통신 CCTV</div><div class="txt"><div class="k">${d.k}</div><div class="h">${d.h}</div><div class="row"><div class="brand">${BR}</div>${tel()}</div></div>`,
4:d=>`<div class="num" style="--ns:${d.ns||88}cqi">${d.n}</div><div class="vert">${d.v}</div><div class="rule" style="top:62cqi"></div><div class="ph">${img(d.i)}</div><div class="txt"><div class="k">${d.k}</div><div class="h">${d.h}</div></div><div class="rule" style="bottom:26cqi"></div><div class="bot"><div class="brand">${BR}</div>${tel()}</div>`,
5:d=>`<div class="wrapper"><div class="h">${d.h}</div><div class="bot"><div class="pts">${d.p.map(x=>`<span>${x}</span>`).join("")}</div><div class="brand">${BR}</div>${tel()}</div></div><div class="ph">${img(d.i)}</div>`,
